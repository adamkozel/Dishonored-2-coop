# Recorded takes and candidate archives are append-only: a PR may add files to
# them but not modify, delete or rename existing ones (tools/repo/check-evidence.sh).
# The evidence-amend label allows a deliberate amendment explained in the PR.
name: evidence
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Self-test
        run: sh tools/repo/test-check-evidence.sh
      - name: Takes and candidate archives are append-only
        run: sh tools/repo/check-evidence.sh "$BASE_SHA" "$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVIDENCE_AMEND: ${{ contains(github.event.pull_request.labels.*.name, 'evidence-amend') && '1' || '0' }}
