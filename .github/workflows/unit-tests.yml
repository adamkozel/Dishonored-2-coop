# Builds every target of the lab project (mod DLL, probes, tests) with MSVC and
# runs the self-contained unit tests. authoring_clip_tests needs a game-derived
# clip as input, so it is built but only run locally.
name: unit-tests
on:
  pull_request:
    paths: ['outputs/d2-coop-lab/**', '.github/workflows/unit-tests.yml']
  push:
    branches: [main]
    paths: ['outputs/d2-coop-lab/**', '.github/workflows/unit-tests.yml']
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: cmake -S outputs/d2-coop-lab -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Run unit tests
        shell: pwsh
        run: |
          $tests = Get-ChildItem build/Release/d2_*_tests.exe | Where-Object Name -ne 'd2_authoring_clip_tests.exe'
          if ($tests.Count -lt 10) { throw "Expected the unit tests, found $($tests.Count)" }
          $failed = @()
          foreach ($t in $tests) {
            Write-Host "::group::$($t.Name)"
            & $t.FullName
            $code = $LASTEXITCODE
            Write-Host "::endgroup::"
            if ($code) { $failed += "$($t.Name) (exit $code)" } else { Write-Host "PASS $($t.Name)" }
          }
          if ($failed) { throw "Failed: $($failed -join ', ')" }
